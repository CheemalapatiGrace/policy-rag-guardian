name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (offline, no API keys)
        run: pytest
      - name: Eval quality gate (fails the build below thresholds)
        run: python -m rag_guardian.evals
      - name: Benchmark smoke test
        run: python scripts/bench.py --requests 200 --concurrency 4

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t policy-rag-guardian:ci .
